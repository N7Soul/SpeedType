<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedType - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Error Modal -->
    <div id="errorModal" class="modal hidden">
        <div class="modal-content">
            <h3>⚠️ Error</h3>
            <p id="errorMessage"></p>
            <button id="closeModal" class="btn btn-primary">OK</button>
        </div>
    </div>

    <div class="game-container">
        <!-- Lobby Screen -->
        <div id="lobbyScreen" class="screen">
            <h1>🏁 SpeedType</h1>
            <div class="lobby-content">
                <div class="player-setup">
                    <input type="text" id="playerName" placeholder="Enter your name" maxlength="15">
                    <div class="game-settings">
                        <label for="wordLength">Word Length:</label>
                        <select id="wordLength" class="word-length-select">
                            <option value="random">Random (Any Length)</option>
                            <option value="3">3 Letters</option>
                            <option value="4">4 Letters</option>
                            <option value="5">5 Letters</option>
                            <option value="6">6 Letters</option>
                            <option value="7">7 Letters</option>
                            <option value="8">8 Letters</option>
                            <option value="9">9 Letters</option>
                            <option value="10">10 Letters</option>
                        </select>
                    </div>
                    <button id="startGame" class="btn btn-primary">Start Race</button>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen hidden">
            <div class="race-info">
                <div id="countdown" class="countdown"></div>
                <div class="position">WPM: <span id="position">0</span></div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div class="typing-area">
                <div id="targetWord" class="target-word"></div>
                <input type="text" id="typingInput" class="typing-input" placeholder="Type the word..." autocomplete="off" disabled>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen hidden">
            <h2>🏆 Race Results</h2>
            <div id="resultsList" class="results-list"></div>
            <button id="playAgain" class="btn btn-primary">Play Again</button>
            <button id="backToLobby" class="btn btn-secondary">Back to Lobby</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
